[project]
name = "playbook-08-multimodal-mlops"
version = "2026.10"
description = "End-to-end MLOps on Oxford RobotCar INS and camera data: features, training with MLflow, serving, drift detection and retraining (Data Engineering for Multimodal AI, Chapter 8)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "opencv-python-headless>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    # On Linux, xgboost-cpu is the same package without the 305 MB NVIDIA NCCL library
    "xgboost>=2.0; sys_platform != 'linux'",
    "xgboost-cpu>=2.0; sys_platform == 'linux'",
    "mlflow>=3.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "requests>=2.31",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "flake8>=7",
    "black>=24",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "enhancements_modules*"]

# On Linux, PyPI's torch is the CUDA build (several GB of CUDA libraries plus Triton).
# This playbook runs on CPU, so Linux gets the CPU build. macOS and Windows use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "enhancements_modules/tests"]
markers = ["integration: runs pipeline stages on the sample data"]
