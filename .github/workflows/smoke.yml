name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC, so breakage in upstream packages shows up

jobs:
  smoke:
    # The whole pipeline on the sample data (CPU): features, training, MLflow registry, serving,
    # the drift-retrain-promote replay, the dashboard, plus the unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Cache the ResNet-18 weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/torch
          key: torch-resnet18
      - name: Smoke test
        run: make smoke
      # README "Run it", steps 2 to 4, as written
      - name: Run it, step 2 (make run)
        run: |
          set -o pipefail
          make run 2>&1 | tee /tmp/run.txt
          grep -qE "Registered ins-turn-classifier version [0-9]+: test F1" /tmp/run.txt  # make smoke registered versions before
          grep -q "F1 while the sensor is noisy:" /tmp/run.txt
          grep -q "MLOps pipeline completed in" /tmp/run.txt
      - name: Run it, steps 3 and 4 (make models, make api, make predict)
        run: |
          set -o pipefail
          make models | tee /tmp/models.txt
          grep -q "<- champion" /tmp/models.txt
          make api > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8000/health > /dev/null && break; sleep 2; done
          make predict MINUTE=36.4 | tee /tmp/predict.txt
          grep -qE "model v[0-9]+: (Turn ahead|Driving straight)" /tmp/predict.txt
          grep -q "what happened: Turn ahead" /tmp/predict.txt
          pkill -f "uvicorn src.serve.api:app" || true
      - name: Use your own data (file checks)
        run: uv run --frozen pytest -q tests/test_own_data.py
      - name: Try this 1 to 3
        run: |
          set -o pipefail
          make try-noise-level | tee /tmp/t1.txt
          grep -qE "^ 0\.10 +15 " /tmp/t1.txt
          make try-batch-size | tee /tmp/t2.txt
          grep -qE "^ +100 +25 " /tmp/t2.txt
          make try-split | tee /tmp/t3.txt
          grep -q "random (first edition)" /tmp/t3.txt
      - name: API log on failure
        if: failure()
        run: tail -50 /tmp/api.log || true
      - name: Printed install path and command (pip, pipeline/run_pipeline.py)
        run: |
          make clean-data
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r pipeline/requirements.txt -r enhancements_modules/requirements-enhancements.txt
          /tmp/pipenv/bin/python -m pip install -q -e .
          /tmp/pipenv/bin/python pipeline/run_pipeline.py --port 18080
      - name: The book's step-by-step commands (ingest, features, alignment, training, prediction, serving)
        run: |
          make clean-data
          for step in src.ingest.video_ingest src.ingest.ins_ingest src.features.ins_features \
                      src.features.video_features src.align.temporal_alignment src.models.train \
                      src.models.predict src.serve.model_service src.serve.client; do
            echo "::group::python -m $step"
            /tmp/pipenv/bin/python -m $step 2>&1 | tee /tmp/step.log
            echo "::endgroup::"
            ! grep -qiE "Failed to load|Could not load a trained model" /tmp/step.log
          done

  airflow:
    # The Airflow DAG with Airflow 3 in its own environment; the tasks use the playbook's Python
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install the playbook and Airflow
        run: |
          uv sync --python 3.12
          uv venv --python 3.12 /tmp/airflow-venv
          uv pip install --python /tmp/airflow-venv/bin/python "apache-airflow==3.3.2" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - name: Run the DAG once (airflow dags test)
        run: |
          export AIRFLOW__CORE__DAGS_FOLDER=$PWD/airflow/dags
          export PLAYBOOK_PYTHON=$PWD/.venv/bin/python
          /tmp/airflow-venv/bin/airflow db migrate
          export API_URL=http://127.0.0.1:9   # no API running: the deploy step reports that and succeeds
          /tmp/airflow-venv/bin/airflow dags test ins_mlops_pipeline 2>&1 | tee /tmp/dag.log
          # A fresh clone has no model, so the run takes the train_model branch
          grep "DagRun Finished" /tmp/dag.log | grep -q "state=success"
          grep -q "running task <TaskInstance: ins_mlops_pipeline.train_model" /tmp/dag.log
          cat experiments/models/evaluation_summary.json

  devcontainer:
    # Builds .devcontainer/ the way Codespaces does and runs the playbook inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the devcontainer and run the playbook
        uses: devcontainers/ci@v0.3
        with:
          push: never
          # The first output command, timed, as a reader would see it in a new Codespace
          runCmd: start=$(date +%s) && make run && echo "Time to first output in a clean devcontainer was $(( $(date +%s) - start )) s"
