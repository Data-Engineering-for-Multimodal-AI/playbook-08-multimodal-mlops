version: '1.0'

video:
  source_path: 'oxfordrobocar_sample_small/stereo/centre'
  format: 'png'
  sampling_rate: 10  # Hz
  timestamp_format: 'filename'  # Timestamp is embedded in filename
  features:
    - name: 'histogram_features'
      type: 'numpy.ndarray'
      shape: [256, 3]  # RGB histogram bins
      description: 'Color histogram features from video frames'
    - name: 'embedding_features'
      type: 'numpy.ndarray'
      shape: [512]  # Resnet feature dimension 
      description: 'CNN embeddings extracted from video frames'

imu:
  source_path: 'oxfordrobocar_sample_small/gps/ins.csv'
  sampling_rate: 50  # Hz
  description: 'INS (Inertial Navigation System) data with velocity and orientation'
  columns:
    - name: 'timestamp'
      type: 'int64'
      description: 'Unix timestamp in microseconds'
    - name: 'velocity_north'
      type: 'float64'
      unit: 'm/s'
      description: 'North component of velocity'
    - name: 'velocity_east'
      type: 'float64'
      unit: 'm/s'
      description: 'East component of velocity'
    - name: 'velocity_down'
      type: 'float64'
      unit: 'm/s'
      description: 'Down component of velocity'
    - name: 'roll'
      type: 'float64'
      unit: 'rad'
      description: 'Roll angle'
    - name: 'pitch'
      type: 'float64'
      unit: 'rad'
      description: 'Pitch angle'
    - name: 'yaw'
      type: 'float64'
      unit: 'rad'
      description: 'Yaw angle (heading)'
  features:
    - name: 'statistical_features'
      type: 'numpy.ndarray'
      shape: [20]  # Mean, variance, min, max, FFT for each channel
      description: 'Statistical features from velocity and orientation signals'

alignment:
  window_size: 1.0  # seconds
  strategy: 'nearest'  # Match nearest video frame to INS signals
  output_rate: 10  # Hz
  
feature_store:
  path: 'experiments/feature_store'
  format: 'parquet' 